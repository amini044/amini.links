<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMINI | Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Outfit,sans-serif;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:url("Background.jpg");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
overflow:hidden;
color:#fff}
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;

background:url("Background.jpg") center center/cover no-repeat;

filter:blur(18px);

transform:scale(1.1);

z-index:-2;
}
.bg,.bg2,.bg3{
position:fixed;border-radius:50%;filter:blur(90px);opacity:.28;z-index:-1;
animation:float 12s ease-in-out infinite alternate}
.bg{width:340px;height:340px;background:#7c3aed;top:-70px;left:-80px}
.bg2{width:280px;height:280px;background:#0ea5e9;right:-60px;top:30%}
.bg3{width:260px;height:260px;background:#2563eb;bottom:-70px;left:40%}
@keyframes float{to{transform:translateY(40px) translateX(40px) scale(1.15)}}
.card{
width:min(430px,92%);
padding:38px;
border-radius:32px;
background:rgba(255,255,255,.07);
backdrop-filter:blur(24px);
border:1px solid rgba(255,255,255,.13);
box-shadow:0 30px 70px rgba(0,0,0,.5);
text-align:center}
.avatar{
width:110px;
height:110px;
border-radius:50%;
margin:auto;
display:block;
object-fit:cover;
border:3px solid rgba(255,255,255,.15);
box-shadow:0 0 35px rgba(139,92,246,.5);
transition:.4s;
}

.avatar:hover{
transform:scale(1.08);
box-shadow:0 0 45px rgba(139,92,246,.9);
}
h1{margin-top:20px;font-size:42px;letter-spacing:6px}
p{margin:10px 0 28px;color:#cfcfcf}
a{
display:flex;
justify-content:center;
align-items:center;
gap:12px;
margin:14px 0;
padding:16px;
text-decoration:none;
color:#fff;
font-size:18px;
font-weight:600;
border-radius:22px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.15);
backdrop-filter:blur(30px);
transition:.35s}
a:hover{
transform:translateY(-4px) scale(1.02);
background:rgba(255,255,255,.14)}
small{display:block;margin-top:26px;color:#8d8d8d}
</style>
</head>
<body>

<div class="bg"></div>
<div class="bg2"></div>
<div class="bg3"></div>

<div class="card">
<img src="profile.jpg" class="avatar" alt="Profile">
<h1>AMINI</h1>
<p>Find me everywhere.</p>

<a href="https://www.instagram.com/_amxxni__?igsh=dTR6aDJnNm10eGR1&utm_source=qr" target="_blank">📸 Instagram</a>

<a href="https://www.tiktok.com/@_amxxni__?_r=1&_t=ZG-9879YTf7n6n" target="_blank">🎵 TikTok</a>

<a href="https://t.me/t322v" target="_blank">✈️ Telegram</a>

<a href="https://snapchat.com/t/GcN8ydYg" target="_blank">👻 Snapchat</a>

<small>© AMINI</small>
</div>


<audio id="bgmusic" loop>
    <source src="music.m4a" type="audio/mp4">
</audio>

<script>
document.body.addEventListener("click", function () {
    document.getElementById("bgmusic").play();
}, { once: true });
</script>

</body>
</html>
