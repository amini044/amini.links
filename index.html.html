<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Outfit,sans-serif;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#050505;
overflow:hidden;
color:#fff}
.bg,.bg2,.bg3{
position:fixed;border-radius:50%;filter:blur(90px);opacity:.28;z-index:-1;
animation:float 12s ease-in-out infinite alternate}
.bg{width:340px;height:340px;background:#7c3aed;top:-70px;left:-80px}
.bg2{width:280px;height:280px;background:#0ea5e9;right:-60px;top:30%}
.bg3{width:260px;height:260px;background:#2563eb;bottom:-70px;left:40%}
@keyframes float{to{transform:translateY(40px) translateX(40px) scale(1.15)}}
.card{
width:min(430px,92%);
padding:38px;
border-radius:32px;
background:rgba(255,255,255,.07);
backdrop-filter:blur(24px);
border:1px solid rgba(255,255,255,.13);
box-shadow:0 30px 70px rgba(0,0,0,.5);
text-align:center}
.avatar{
width:110px;height:110px;border-radius:50%;
margin:auto;
background:linear-gradient(135deg,#0ea5e9,#8b5cf6);
display:flex;align-items:center;justify-content:center;
font-size:42px;font-weight:800;
box-shadow:0 0 35px rgba(139,92,246,.5)}
h1{margin-top:20px;font-size:42px;letter-spacing:6px}
p{margin:10px 0 28px;color:#cfcfcf}
a{
display:flex;
justify-content:center;
align-items:center;
gap:12px;
margin:14px 0;
padding:16px;
text-decoration:none;
color:#fff;
font-size:18px;
font-weight:600;
border-radius:22px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.15);
backdrop-filter:blur(30px);
transition:.35s}
a:hover{
transform:translateY(-4px) scale(1.02);
background:rgba(255,255,255,.14)}
small{display:block;margin-top:26px;color:#8d8d8d}
</style>
</head>
